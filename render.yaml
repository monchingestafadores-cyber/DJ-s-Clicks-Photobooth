services:
  - type: web
    name: djs-click-booth
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: BOOTH_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_DELIVERY
        value: "true"
      - key: DATA_DIR
        value: /var/data/djs-click
    disk:
      name: booth-photo-storage
      mountPath: /var/data
      sizeGB: 1
